name: Image

# Builds the search service, checks that it starts and answers, and publishes it to GHCR, which the
# ECS task pulls with no credentials once the package is public. Nothing here touches AWS.
on:
  push:
    branches: [main]
    paths: [Dockerfile, package.json, package-lock.json, "src/**", ".github/workflows/image.yml"]
  pull_request:
    paths: [Dockerfile, package.json, package-lock.json, "src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/renatoctti/rag-search-eval

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t "$IMAGE:test" .
      - name: The container starts, answers the health check, and refuses a search with no database
        run: |
          docker run -d --name svc -p 3000:3000 "$IMAGE:test"
          for i in $(seq 1 30); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf localhost:3000/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/search \
            -H 'Content-Type: application/json' -d '{"query":"aspirin"}')
          test "$code" = 503
          docker logs svc | grep -q '"Errors":1'
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:test" "$IMAGE:latest"
          docker tag "$IMAGE:test" "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
