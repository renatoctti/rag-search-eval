name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Never applied from CI: it has no AWS credentials. It checks that the code is formatted, valid
  # for the AWS provider, free of the usual mistakes and of known insecure settings.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - run: terraform -chdir=infra fmt -check -recursive -diff
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir infra --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir infra
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: infra/.trivyignore

  # Indexes SciFact in a real pgvector container and scores every retriever. It fails when a
  # method's nDCG@10 falls more than 0.01 under results/scifact.json.
  evaluate:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/models
            .cache/embeddings.jsonl
            data
          key: scifact-bge-small-v1
      - run: npm run ingest
      - run: npm run evaluate -- --report results/latest.json --baseline results/scifact.json --max-drop 0.01 | tee evaluation.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: |
            results/latest.json
            evaluation.md
